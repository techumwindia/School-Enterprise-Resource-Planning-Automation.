{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 560px">
  <div class="card-body">
    <h1 class="h5">Delete this record?</h1>
    <p class="text-muted mb-4"><strong>{{ object }}</strong> will be permanently removed.</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger"><i class="bi bi-trash"></i> Delete</button>
      <a class="btn btn-light" href="{% url url_prefix|add:'_list' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
